name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validation & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma Schema
        run: npm run db:validate

      - name: Run Test Suite
        run: npm test
        env:
          NODE_ENV: test
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ENCRYPTION_KEY_PRIMARY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ENCRYPTION_ACTIVE_KEY_ID: primary

      - name: Run Delivery Smoke Test
        run: npm run test:delivery
        env:
          NODE_ENV: test

      - name: Run Speaking Smoke Test
        run: npm run test:speaking
        env:
          NODE_ENV: test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
