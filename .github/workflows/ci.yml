name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      ENCRYPTION_KEY: 1111111111111111111111111111111111111111111111111111111111111111
      NEXT_PUBLIC_SITE_URL: https://www.ieltslab.org
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: local-ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: supabase start
      - run: supabase db reset --local --no-seed
      - run: supabase db lint --local --schema app_private --level warning --fail-on error
      - run: node scripts/run-tests.mjs tests/database
      - run: npm test
      - run: npm run db:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
