<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f5f5f3;font-family:Arial,Helvetica,sans-serif;color:#171717">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f3;padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e8e8e5;border-radius:24px">
          <tr><td style="padding:32px">
            <p style="margin:0;color:#d20b2b;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase">IELTS Lab Oran</p>
            <h1 style="margin:18px 0 0;font-size:28px;line-height:1.2;letter-spacing:-0.6px">Confirm your email address</h1>
            <p style="margin:16px 0 0;color:#626262;font-size:15px;line-height:1.7">Use the secure button below to verify your email and finish creating your account.</p>
            <table role="presentation" cellspacing="0" cellpadding="0" style="margin-top:26px"><tr><td style="border-radius:999px;background:#171717"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700">Confirm email</a></td></tr></table>
            <p style="margin:26px 0 0;color:#8a8a8a;font-size:12px;line-height:1.6">If you did not create an IELTS Lab Oran account, you can ignore this message.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
