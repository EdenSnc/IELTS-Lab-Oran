<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f5f5f3;font-family:Arial,Helvetica,sans-serif;color:#171717">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f3;padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e8e8e5;border-radius:24px">
          <tr><td style="padding:32px">
            <p style="margin:0;color:#d20b2b;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase">IELTS Lab Oran</p>
            <h1 style="margin:18px 0 0;font-size:28px;line-height:1.2;letter-spacing:-0.6px">Verify this browser</h1>
            <p style="margin:16px 0 0;color:#626262;font-size:15px;line-height:1.7">Enter this one-time code on the device-security screen:</p>
            <p style="margin:22px 0 0;font-size:34px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
            <p style="margin:26px 0 0;color:#8a8a8a;font-size:12px;line-height:1.6">If you did not request this code, you can ignore this message. Never share this code.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
